name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: AgentKit
        run: swift test --package-path Packages/AgentKit
      - name: EdenRendering
        run: swift test --package-path Packages/EdenRendering
      - name: App
        run: swift test --package-path App
      - name: Release build
        run: swift build -c release --package-path App
